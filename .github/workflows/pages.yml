name: Pages

# 웹 데모 배포: 단일 HTML + 배포 시점 Data Dragon 카탈로그. OP.GG 조회는 데모에서 꺼진다.
on:
  push:
    branches: [main]
  schedule:
    # 새 패치 카탈로그를 반영하도록 매주 월요일 다시 배포한다.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: npm run smoke:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
